<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ToneLoc/Go :: THE GAME</title>
<style>
  :root{--green:#33ff66;--amber:#ffb000;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;color:#cfcfcf;font-family:"Courier New",monospace;overflow:hidden;}
  #matrix{position:fixed;inset:0;z-index:0;opacity:.28;}
  #frame{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(10,10,10,.6) 0%, rgba(0,0,0,.93) 80%);}
  #bezel{position:relative;padding:24px 28px 40px;border-radius:24px;
    background:linear-gradient(155deg,#343434,#0c0c0c);
    box-shadow: inset 0 0 4px #000, inset 0 2px 14px rgba(255,255,255,.05), 0 22px 70px rgba(0,0,0,.85), 0 0 0 2px #000;}
  #bezel::after{content:"";position:absolute;right:34px;bottom:15px;width:8px;height:8px;border-radius:50%;
    background:var(--green);box-shadow:0 0 8px var(--green);animation:led 3.2s infinite;}
  @keyframes led{0%,92%,100%{opacity:1}95%{opacity:.3}}
  #screen{position:relative;border-radius:14px/12px;overflow:hidden;background:#000;
    box-shadow: inset 0 0 70px rgba(0,0,0,.95), inset 0 0 16px rgba(60,255,120,.06);}
  #cv{display:block;image-rendering:pixelated;filter:
      drop-shadow(.6px 0 0 rgba(255,40,40,.32)) drop-shadow(-.6px 0 0 rgba(40,200,255,.32));}
  #scanlines{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:multiply;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 1px, rgba(0,0,0,.32) 2px, rgba(0,0,0,.32) 3px);}
  #grille{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:screen;opacity:.05;
    background:repeating-linear-gradient(to right,#f00 0,#0f0 1px,#00f 2px,#000 3px);}
  #sweep{position:absolute;left:0;right:0;height:22%;z-index:6;pointer-events:none;
    background:linear-gradient(to bottom, rgba(120,255,170,0), rgba(120,255,170,.06), rgba(120,255,170,0));animation:roll 7.5s linear infinite;}
  @keyframes roll{0%{top:-25%}100%{top:105%}}
  #noise{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.04;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:fuzz .5s steps(3) infinite;}
  @keyframes fuzz{0%{background-position:0 0}33%{background-position:-40px 30px}66%{background-position:30px -20px}100%{background-position:0 0}}
  #vignette{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:14px/12px;box-shadow: inset 0 0 130px rgba(0,0,0,.6);}
  #screen.glitch #cv{animation:glitch .28s steps(2) 1;}
  @keyframes glitch{
    0%{transform:translate(0,0);}
    20%{transform:translate(-4px,1px);filter:drop-shadow(7px 0 0 rgba(255,0,80,.6)) drop-shadow(-7px 0 0 rgba(0,255,210,.6)) hue-rotate(18deg);clip-path:inset(8% 0 70% 0);}
    40%{transform:translate(5px,-2px);clip-path:inset(60% 0 12% 0);}
    60%{transform:translate(-3px,0);filter:drop-shadow(9px 0 0 rgba(255,0,80,.6)) drop-shadow(-9px 0 0 rgba(0,255,210,.6));clip-path:inset(30% 0 40% 0);}
    100%{transform:translate(0,0);}
  }
  #screen.glitch #noise{opacity:.2;}
  #label{margin-top:14px;text-align:center;color:#6a6a6a;font-size:12px;letter-spacing:2px;}
  #label b{color:var(--amber);}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="frame">
  <div id="bezel">
    <div id="screen">
      <canvas id="cv"></canvas>
      <div id="grille"></div>
      <div id="scanlines"></div>
      <div id="sweep"></div>
      <div id="noise"></div>
      <div id="vignette"></div>
    </div>
    <div id="label">T O N E L O C / G O &nbsp;::&nbsp; <b>THE GAME</b> &nbsp;|&nbsp; click to start &middot; ENTER play &middot; M views &middot; C clear-logs &middot; S sound</div>
  </div>
</div>

<script>
// Matrix hex-rain backdrop.
(function(){
  const cv=document.getElementById('matrix'),ctx=cv.getContext('2d');
  const g='0123456789ABCDEF$#%&*+=/\\<>?ATDTCONNECTNOCARRIER'.split('');let cols,drops,fs=14;
  function r(){cv.width=innerWidth;cv.height=innerHeight;cols=(cv.width/fs)|0;drops=Array(cols).fill(0).map(()=>Math.random()*-50);}
  r();addEventListener('resize',r);
  (function t(){ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(0,0,cv.width,cv.height);ctx.font=fs+'px monospace';
    for(let i=0;i<cols;i++){const c=g[(Math.random()*g.length)|0],x=i*fs,y=drops[i]*fs;
      ctx.fillStyle=Math.random()<0.02?'#aaffcc':'rgba(40,200,90,.85)';ctx.fillText(c,x,y);
      if(y>cv.height&&Math.random()>0.975)drops[i]=0;drops[i]++;}
    setTimeout(()=>requestAnimationFrame(t),55);})();
})();
// Periodic glitch bursts.
(function(){const s=document.getElementById('screen');(function l(){setTimeout(()=>{s.classList.add('glitch');
  setTimeout(()=>s.classList.remove('glitch'),300);l();},3500+Math.random()*6000);})();})();
</script>
<script src="seed.js"></script>
<script src="toneloc.js"></script>
</body>
</html>
