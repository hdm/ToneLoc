<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ToneLoc/Go &mdash; war-dialing the IPv4 phone book</title>
<style>
  :root { --amber:#ffb000; --green:#33ff66; --phos:rgba(80,255,140,.45); }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;color:#cfcfcf;
    font-family:"Courier New",monospace;overflow:hidden;}

  /* Matrix hex-rain backdrop behind the whole machine. */
  #matrix{position:fixed;inset:0;z-index:0;opacity:.30;}

  #frame{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(10,10,10,.65) 0%, rgba(0,0,0,.92) 78%);}

  /* The monitor housing. Scaled as one unit (transform) to fill the viewport. */
  #bezel{position:relative;display:inline-block;padding:18px 22px 30px;border-radius:24px;
    transform-origin:center center;will-change:transform;
    background:linear-gradient(155deg,#343434,#0c0c0c);
    box-shadow: inset 0 0 4px #000, inset 0 2px 14px rgba(255,255,255,.05),
                0 22px 70px rgba(0,0,0,.85), 0 0 0 2px #000;}
  #bezel::after{ content:"";position:absolute;right:30px;bottom:12px;width:8px;height:8px;border-radius:50%;
    background:var(--green);box-shadow:0 0 8px var(--green);animation:led 3.2s infinite;}
  @keyframes led{0%,92%,100%{opacity:1}95%{opacity:.3}}

  /* #screen hugs the terminal exactly (no dead space). */
  #screen{position:relative;display:inline-block;border-radius:14px/12px;overflow:hidden;background:#000;
    box-shadow: inset 0 0 70px rgba(0,0,0,.95), inset 0 0 16px rgba(60,255,120,.06);
    transform-origin:center;}
  #screen.boot{animation:poweron 1.1s ease-out forwards;}
  @keyframes poweron{
    0%{transform:scale(1,.002);filter:brightness(6);opacity:0;}
    8%{transform:scale(1,.004);filter:brightness(6);opacity:1;}
    45%{transform:scale(1.01,1);filter:brightness(2.2);}
    100%{transform:scale(1,1);filter:brightness(1);}
  }

  /* The terminal; constant chromatic aberration + phosphor bloom. */
  #term{display:inline-block;padding:12px;line-height:0;filter:
      drop-shadow(.6px 0 0 rgba(255,40,40,.32))
      drop-shadow(-.6px 0 0 rgba(40,200,255,.32));}
  #term canvas,#term .xterm{image-rendering:pixelated;}

  #scanlines{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:multiply;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,.30) 2px, rgba(0,0,0,.30) 3px);}
  #grille{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:screen;opacity:.05;
    background:repeating-linear-gradient(to right,#f00 0,#0f0 1px,#00f 2px,#000 3px);}
  /* A slow, gentle rolling brightness band (no flicker). */
  #sweep{position:absolute;left:0;right:0;height:22%;z-index:6;pointer-events:none;
    background:linear-gradient(to bottom, rgba(120,255,170,0), rgba(120,255,170,.05), rgba(120,255,170,0));
    animation:roll 11s linear infinite;}
  @keyframes roll{0%{top:-25%}100%{top:105%}}
  /* Static TV-noise overlay (no animation -> no shimmer/flicker). */
  #noise{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  #vignette{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:14px/12px;
    box-shadow: inset 0 0 130px rgba(0,0,0,.65);}

  /* Occasional, brief glitch tear (not a flicker; fires rarely). */
  #screen.glitch #term{animation:glitch .28s steps(2) 1;}
  @keyframes glitch{
    0%{transform:translate(0,0);}
    25%{transform:translate(-4px,1px);filter:drop-shadow(6px 0 0 rgba(255,0,80,.6)) drop-shadow(-6px 0 0 rgba(0,255,210,.6)) hue-rotate(18deg);clip-path:inset(8% 0 70% 0);}
    50%{transform:translate(5px,-2px);clip-path:inset(58% 0 14% 0);}
    75%{transform:translate(-3px,0);clip-path:inset(30% 0 40% 0);}
    100%{transform:translate(0,0);}
  }

  #label{display:block;margin-top:14px;text-align:center;color:#6a6a6a;font-size:12px;
    letter-spacing:2px;white-space:normal;max-width:100%;}
  #label b{color:var(--amber);}
  #status{position:absolute;top:8px;right:14px;z-index:9;font-size:11px;color:#555;}
  #status.live{color:var(--green);text-shadow:0 0 6px var(--green);}

  #tools{position:fixed;top:10px;left:12px;z-index:20;display:flex;gap:6px;}
  #tools button{background:rgba(20,20,20,.6);color:#6a6a6a;border:1px solid #333;border-radius:6px;
    font:14px monospace;padding:4px 9px;cursor:pointer;}
  #tools button:hover{color:var(--green);border-color:var(--green);}
  #toast{position:fixed;top:46px;left:12px;z-index:20;color:var(--green);font:12px monospace;
    text-shadow:0 0 6px var(--phos);opacity:0;transition:opacity .3s;}
  #toast.show{opacity:1;}

  #boot{position:absolute;inset:0;z-index:8;padding:16px 18px;color:var(--green);
    background:#000;font-size:14px;line-height:1.45;white-space:pre-wrap;text-shadow:0 0 6px var(--phos);}
  #boot .cur{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  a{color:var(--amber);}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="tools">
  <button id="fsbtn" title="toggle fullscreen">⛶ fullscreen</button>
  <button id="savebtn" title="download current scan state (.DAT)">▼ save</button>
  <button id="loadbtn" title="upload a previous scan state to resume">▲ load</button>
  <input id="loadfile" type="file" accept=".DAT,.dat,application/octet-stream" style="display:none">
</div>
<div id="toast"></div>
<div id="frame">
  <div id="bezel">
    <div id="screen" class="boot">
      <div id="status">&#9675; offline</div>
      <div id="term"></div>
      <div id="grille"></div>
      <div id="scanlines"></div>
      <div id="sweep"></div>
      <div id="noise"></div>
      <div id="vignette"></div>
      <div id="boot"></div>
    </div>
    <div id="label">T O N E L O C / G O &nbsp;&mdash;&nbsp; <b>ghostty.js</b> terminal &nbsp;|&nbsp; click + type. M=views, S=sound, ESC=quit.</div>
  </div>
</div>

<script>
// ---- Matrix hex-rain backdrop --------------------------------------------
(function(){
  const cv = document.getElementById('matrix'), ctx = cv.getContext('2d');
  const glyphs = '0123456789ABCDEF$#%&*+=/\\<>?ATDTCONNECTNOCARRIER'.split('');
  let cols, drops, fs = 14;
  function resize(){ cv.width = innerWidth; cv.height = innerHeight;
    cols = Math.floor(cv.width / fs); drops = Array(cols).fill(0).map(()=>Math.random()*-50); }
  resize(); addEventListener('resize', resize);
  function tick(){
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font = fs+'px monospace';
    for(let i=0;i<cols;i++){
      const c = glyphs[(Math.random()*glyphs.length)|0];
      const x = i*fs, y = drops[i]*fs;
      ctx.fillStyle = Math.random()<0.02 ? '#aaffcc' : 'rgba(40,200,90,.85)';
      ctx.fillText(c, x, y);
      if(y > cv.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 1;
    }
    setTimeout(()=>requestAnimationFrame(tick), 55);
  }
  tick();
})();

// ---- Scale the monitor to fill the viewport (80x25 at most, kept crisp) ---
const bezel = document.getElementById('bezel');
function fit(){
  const w = bezel.offsetWidth, h = bezel.offsetHeight;
  if(!w || !h) return;
  const s = Math.min(innerWidth / w, innerHeight / h);
  bezel.style.transform = 'scale(' + Math.max(0.1, s) + ')';
}
addEventListener('resize', fit);
document.addEventListener('fullscreenchange', ()=>setTimeout(fit, 60));
new ResizeObserver(fit).observe(document.getElementById('screen'));

// ---- Fullscreen toggle ----------------------------------------------------
function toggleFS(){
  if(document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen?.() || Promise.resolve()).catch(()=>{});
}
document.getElementById('fsbtn').addEventListener('click', (e)=>{ e.preventDefault(); toggleFS(); });

// ---- Occasional glitch tear (rare; not a flicker) -------------------------
(function(){
  const screen = document.getElementById('screen');
  (function loop(){
    setTimeout(()=>{ screen.classList.add('glitch');
      setTimeout(()=>screen.classList.remove('glitch'), 300); loop();
    }, 9000 + Math.random()*12000);
  })();
})();

// ---- Fake BIOS/POST boot sequence ----------------------------------------
const bootEl = document.getElementById('boot');
const BOOT = [
  "ToneLoc/Go BIOS v1.10  (c) 1994-2026 Minor Threat & Mucho Maas","",
  "Detecting CPU................. GenuineGopher @ 4.77 THz",
  "Memory test................... 640K OK (the rest is for the demos)",
  "Initializing FOSSIL driver.... OK",
  "Probing serial ports.......... COM1 16550A  COM2 -none-",
  "Resetting modem  ATZ.......... OK",
  "Loading TONELOC.CFG........... OK",
  "Spinning up zmap-go scanner... OK",
  "Acquiring carrier.............",
];
let bi=0, bc=0, bootText="";
function boot(){
  if (bi>=BOOT.length){ bootEl.innerHTML = bootText + '<span class="cur">_</span>'; return; }
  const line = BOOT[bi];
  if (bc<=line.length){ bootEl.innerHTML = bootText + line.slice(0,bc) + '<span class="cur">_</span>'; bc++;
    setTimeout(boot, line?9:60);
  } else { bootText += line + "\n"; bi++; bc=0; setTimeout(boot,70); }
}
boot();

// ---- WebAudio modem sounds -----------------------------------------------
const Modem = (function(){
  let ctx=null, last={}, hsUntil=0;
  function ensure(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(f,d,when,ty,g){ const c=ctx,o=c.createOscillator(),gn=c.createGain();
    o.type=ty||'sine'; o.frequency.value=f; o.connect(gn); gn.connect(c.destination);
    const a=g==null?0.14:g; gn.gain.setValueAtTime(0,when); gn.gain.linearRampToValueAtTime(a,when+0.008);
    gn.gain.setValueAtTime(a,when+d-0.02); gn.gain.linearRampToValueAtTime(0,when+d); o.start(when); o.stop(when+d); }
  function noise(d,when,g){ const c=ctx,n=Math.max(1,(c.sampleRate*d)|0),buf=c.createBuffer(1,n,c.sampleRate),da=buf.getChannelData(0);
    for(let i=0;i<n;i++) da[i]=Math.random()*2-1; const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.6;
    const gn=c.createGain(); gn.gain.value=g==null?0.06:g; src.connect(f); f.connect(gn); gn.connect(c.destination); src.start(when); src.stop(when+d); }
  function rate(k,ms){ const n=performance.now(); if(n-(last[k]||0)<ms) return false; last[k]=n; return true; }
  return { resume(){ ensure(); },
    dial(){ if(!ensure()||!rate('dial',130)) return; const t=ctx.currentTime; tone(941,.05,t,'sine',.07); tone(1336,.05,t,'sine',.07); },
    tone(){ if(!ensure()||!rate('tone',220)) return; tone(1150,.22,ctx.currentTime,'sine',.1); },
    busy(){ if(!ensure()||!rate('busy',420)) return; let t=ctx.currentTime; for(let i=0;i<2;i++){ tone(480,.18,t,'sine',.09); tone(620,.18,t,'sine',.09); t+=.31; } },
    connect(){ if(!ensure()) return; const now=performance.now(); if(now<hsUntil){ tone(1100,.18,ctx.currentTime,'sine',.09); return; }
      hsUntil=now+2700; let t=ctx.currentTime; tone(350,.35,t,'sine',.06); tone(440,.35,t,'sine',.06); t+=.4;
      [[697,1209],[770,1336],[852,1477],[697,1477],[941,1336]].forEach(p=>{ tone(p[0],.07,t,'sine',.08); tone(p[1],.07,t,'sine',.08); t+=.11; });
      t+=.12; tone(2100,.55,t,'sine',.11); t+=.55;
      for(let i=0;i<8;i++){ tone(1100+(i%2?760:-260),.11,t,'square',.045); noise(.11,t,.05); t+=.11; } noise(.55,t,.035); },
  };
})();

// ---- Terminal: ghostty.js first, xterm.js fallback -----------------------
const statusEl = document.getElementById('status');
const mount = document.getElementById('term');
function setStatus(t,live){ statusEl.textContent=(live?'● ':'○ ')+t; statusEl.className=live?'live':''; }
const COLS=80, ROWS=25;

async function makeTerminal(){
  const theme={ background:'#000000', foreground:'#aaaaaa', cursor:'#33ff66' };
  try{
    const g = await import('https://cdn.jsdelivr.net/npm/ghostty-web/+esm');
    if (g.init) await g.init();
    const term = new g.Terminal({ fontSize:16, theme });
    term.open(mount);
    return { term, kind:'ghostty.js' };
  }catch(e){
    console.warn('ghostty-web unavailable, falling back to xterm.js:', e);
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css'; document.head.appendChild(l);
    const x = await import('https://cdn.jsdelivr.net/npm/@xterm/xterm/+esm');
    const term = new x.Terminal({ fontSize:16, theme, cols:COLS, rows:ROWS, convertEol:false });
    term.open(mount);
    return { term, kind:'xterm.js (fallback)' };
  }
}

let SID = null; // per-session id for save/load, delivered by the server
(async () => {
  document.getElementById('screen').addEventListener('animationend', e=>{
    if(e.animationName==='poweron') document.getElementById('screen').classList.remove('boot');
  });

  const { term, kind } = await makeTerminal();
  // Force exactly 80x25 (a few times, since the WASM terminal sizes async) so
  // the render never leaves blank columns on the right.
  const lockSize = ()=>{ try{ term.resize(COLS, ROWS); }catch{} fit(); };
  lockSize(); requestAnimationFrame(lockSize); setTimeout(lockSize, 120); setTimeout(lockSize, 400);

  document.getElementById('label').innerHTML =
    'T O N E L O C / G O &mdash; <b>'+kind+'</b> &nbsp;|&nbsp; click + type. M=views, F=hall of fame, S=sound, ESC=quit.';

  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto+'://'+location.host+'/ws');

  ws.onopen = () => { setStatus('carrier',true); lockSize();
    setTimeout(()=>{ bootEl.style.transition='opacity .4s'; bootEl.style.opacity='0'; setTimeout(()=>bootEl.style.display='none',420); }, 250);
    mount.focus?.(); };
  ws.onclose = () => { setStatus('NO CARRIER',false); term.write('\r\n\x1b[31m-- carrier lost --\x1b[0m\r\n'); };
  ws.onerror = () => setStatus('error',false);
  ws.onmessage = (e) => {
    let data = typeof e.data==='string' ? e.data : new TextDecoder().decode(e.data);
    // Capture the session id (for save/load) and play modem-sound cues; strip both.
    data = data.replace(/\x1b\]1338;([0-9a-f]+)\x07/g, (_, id) => { SID = id; return ''; });
    data = data.replace(/\x1b\]1337;([a-z]+)\x07/g, (_, ev) => { try { Modem[ev] && Modem[ev](); } catch(_){} return ''; });
    if (data) term.write(data);
  };

  term.onData((d)=>{ if (ws.readyState===WebSocket.OPEN) ws.send(d); });
  mount.tabIndex = 0;
  const wake = () => Modem.resume();
  mount.addEventListener('click', ()=>{ mount.focus(); wake(); });
  addEventListener('keydown', wake, { once:false });

  // ---- Save / load scan state ----
  const toast = (m)=>{ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2600); };
  document.getElementById('savebtn').addEventListener('click', ()=>{
    if(!SID){ toast('not connected yet'); return; }
    location.href = '/save?s=' + SID; toast('saving scan state…');
  });
  const fileInput = document.getElementById('loadfile');
  document.getElementById('loadbtn').addEventListener('click', ()=>{ if(!SID){toast('not connected yet');return;} fileInput.click(); });
  fileInput.addEventListener('change', async ()=>{
    const f = fileInput.files[0]; if(!f) return;
    try{ const res = await fetch('/load?s='+SID, { method:'POST', body: await f.arrayBuffer() });
      const j = await res.json(); toast('merged '+(j.merged||0)+' result(s) — resuming'); }
    catch(err){ toast('load failed'); }
    fileInput.value = '';
  });
})();
</script>
</body>
</html>
