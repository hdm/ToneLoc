<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' ws: wss: https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:" />
<title>DARKCIDR &mdash; a ToneLoc/Go war-dialing roguelike</title>
<style>
  :root { --amber:#ffb000; --green:#33ff66; --phos:rgba(80,255,140,.45); }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;color:#cfcfcf;
    font-family:"Courier New",monospace;overflow:hidden;}

  #matrix{position:fixed;inset:0;z-index:0;opacity:.30;}

  #frame{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center, rgba(10,10,10,.65) 0%, rgba(0,0,0,.92) 78%);}

  #bezel{position:relative;display:inline-block;padding:18px 22px 30px;border-radius:24px;
    background:linear-gradient(155deg,#343434,#0c0c0c);
    box-shadow: inset 0 0 4px #000, inset 0 2px 14px rgba(255,255,255,.05),
                0 22px 70px rgba(0,0,0,.85), 0 0 0 2px #000;}
  #bezel::after{ content:"";position:absolute;right:30px;bottom:12px;width:8px;height:8px;border-radius:50%;
    background:var(--green);box-shadow:0 0 8px var(--green);animation:led 3.2s infinite;}
  @keyframes led{0%,92%,100%{opacity:1}95%{opacity:.3}}

  #screen{position:relative;display:inline-block;border-radius:14px/12px;overflow:hidden;background:#000;
    box-shadow: inset 0 0 70px rgba(0,0,0,.95), inset 0 0 16px rgba(60,255,120,.06);}
  #screen.boot{animation:poweron 1.1s ease-out forwards;}
  @keyframes poweron{
    0%{transform:scale(1,.002);filter:brightness(6);opacity:0;}
    8%{transform:scale(1,.004);filter:brightness(6);opacity:1;}
    45%{transform:scale(1.01,1);filter:brightness(2.2);}
    100%{transform:scale(1,1);filter:brightness(1);}
  }

  #term{display:inline-block;padding:12px;line-height:0;filter:
      drop-shadow(.6px 0 0 rgba(255,40,40,.32))
      drop-shadow(-.6px 0 0 rgba(40,200,255,.32));}
  #term canvas,#term .xterm{image-rendering:pixelated;}

  #scanlines{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:multiply;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1px, rgba(0,0,0,.30) 2px, rgba(0,0,0,.30) 3px);}
  #grille{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:screen;opacity:.05;
    background:repeating-linear-gradient(to right,#f00 0,#0f0 1px,#00f 2px,#000 3px);}
  #sweep{position:absolute;left:0;right:0;height:22%;z-index:6;pointer-events:none;
    background:linear-gradient(to bottom, rgba(120,255,170,0), rgba(120,255,170,.05), rgba(120,255,170,0));
    animation:roll 11s linear infinite;}
  @keyframes roll{0%{top:-25%}100%{top:105%}}
  #noise{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  #vignette{position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:14px/12px;
    box-shadow: inset 0 0 130px rgba(0,0,0,.65);}

  #label{display:block;margin-top:8px;text-align:center;color:#4a4a4a;font-size:11px;}
  #status{position:absolute;top:8px;right:14px;z-index:9;font-size:11px;color:#555;}
  #status.live{color:var(--green);text-shadow:0 0 6px var(--green);}

  #restart{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(0,0,0,.82);color:var(--green);font:16px monospace;
    text-shadow:0 0 6px var(--phos);cursor:pointer;text-align:center;}
  #restart.show{display:flex;}
  #restart b{color:var(--amber);font-size:20px;}

  #tools{position:fixed;top:10px;left:12px;z-index:20;display:flex;gap:6px;}
  #tools button{background:rgba(20,20,20,.6);color:#6a6a6a;border:1px solid #333;border-radius:6px;
    font:14px monospace;padding:4px 9px;cursor:pointer;}
  #tools button:hover{color:var(--green);border-color:var(--green);}

  #boot{position:absolute;inset:0;z-index:8;padding:16px 18px;color:var(--green);
    background:#000;font-size:14px;line-height:1.45;white-space:pre-wrap;text-shadow:0 0 6px var(--phos);}
  #boot .cur{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}
  a{color:var(--amber);}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="tools">
  <button id="fsbtn" title="toggle fullscreen">⛶ fullscreen</button>
</div>
<div id="frame">
  <div id="bezel">
    <div id="screen" class="boot">
      <div id="status">&#9675; offline</div>
      <div id="term"></div>
      <div id="grille"></div>
      <div id="scanlines"></div>
      <div id="sweep"></div>
      <div id="noise"></div>
      <div id="vignette"></div>
      <div id="boot"></div>
      <div id="restart"><b>LINK DROPPED</b><br><br>click or press a key to reconnect</div>
    </div>
    <div id="label">click + type &middot; arrows/jk move &middot; ENTER act &middot; R dark &middot; ? help &middot; Q quit</div>
  </div>
</div>

<script>
// ---- Matrix hex-rain backdrop --------------------------------------------
(function(){
  const cv = document.getElementById('matrix'), ctx = cv.getContext('2d');
  const glyphs = '0123456789ABCDEF$#%&*+=/\\<>?ROOTSCANBREACHDARKTRACE'.split('');
  let cols, drops, fs = 14;
  function resize(){ cv.width = innerWidth; cv.height = innerHeight;
    cols = Math.floor(cv.width / fs); drops = Array(cols).fill(0).map(()=>Math.random()*-50); }
  resize(); addEventListener('resize', resize);
  function tick(){
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font = fs+'px monospace';
    for(let i=0;i<cols;i++){
      const c = glyphs[(Math.random()*glyphs.length)|0];
      const x = i*fs, y = drops[i]*fs;
      ctx.fillStyle = Math.random()<0.02 ? '#aaffcc' : 'rgba(40,200,90,.85)';
      ctx.fillText(c, x, y);
      if(y > cv.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 1;
    }
    setTimeout(()=>requestAnimationFrame(tick), 55);
  }
  tick();
})();

// ---- Fullscreen toggle ----------------------------------------------------
function toggleFS(){
  if(document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen?.() || Promise.resolve()).catch(()=>{});
}
document.getElementById('fsbtn').addEventListener('click', (e)=>{ e.preventDefault(); toggleFS(); });

// ---- Fake boot sequence ---------------------------------------------------
const bootEl = document.getElementById('boot');
const BOOT = [
  "DARKCIDR deck firmware v1.10  (c) 1994-2026 Minor Threat & Mucho Maas","",
  "Detecting CPU................. GenuineGopher @ 4.77 THz",
  "Memory test................... 640K OK (the rest is for the ICE)",
  "Initializing cyberdeck........ OK",
  "Mounting TONELOC_SEED......... OK",
  "Loading nerva / brutus........ OK",
  "Bringing up uplink............",
];
let bi=0, bc=0, bootText="";
function boot(){
  if (bi>=BOOT.length){ bootEl.innerHTML = bootText + '<span class="cur">_</span>'; return; }
  const line = BOOT[bi];
  if (bc<=line.length){ bootEl.innerHTML = bootText + line.slice(0,bc) + '<span class="cur">_</span>'; bc++;
    setTimeout(boot, line?9:60);
  } else { bootText += line + "\n"; bi++; bc=0; setTimeout(boot,70); }
}
boot();

// ---- Terminal: ghostty.js first, xterm.js fallback -----------------------
const statusEl = document.getElementById('status');
const mount = document.getElementById('term');
const restartEl = document.getElementById('restart');
function setStatus(t,live){ statusEl.textContent=(live?'● ':'○ ')+t; statusEl.className=live?'live':''; }

// DARKCIDR renders a fixed 80x25 screen, so we pick a font size that makes
// that grid fill the viewport (a comfortable margin), then lock the terminal to
// 80x25 -- no resize is sent to the server.
const COLS = 80, ROWS = 25;
function fontForViewport(){
  const availW = innerWidth * 0.94 - 64;   // minus bezel + term padding
  const availH = innerHeight * 0.90 - 64;
  const byW = availW / (COLS * 0.60);
  const byH = availH / (ROWS * 1.18);
  return Math.max(8, Math.min(28, Math.floor(Math.min(byW, byH))));
}

async function makeTerminal(fontSize){
  const theme={ background:'#000000', foreground:'#aaaaaa', cursor:'#33ff66' };
  try{
    const g = await import('https://cdn.jsdelivr.net/npm/ghostty-web@latest/+esm');
    if (g.init) await g.init();
    const term = new g.Terminal({ fontSize, theme });
    term.open(mount);
    return { term, kind:'ghostty.js' };
  }catch(e){
    console.warn('ghostty-web unavailable, falling back to xterm.js:', e);
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://cdn.jsdelivr.net/npm/@xterm/xterm@5/css/xterm.css'; document.head.appendChild(l);
    const x = await import('https://cdn.jsdelivr.net/npm/@xterm/xterm@5/+esm');
    const term = new x.Terminal({ fontSize, theme, convertEol:false });
    term.open(mount);
    return { term, kind:'xterm.js (fallback)' };
  }
}

let WS = null, TERM = null, closed = false;

function fit(){
  if(!TERM) return;
  const fs = fontForViewport();
  try { if (TERM.options) TERM.options.fontSize = fs; } catch {}
  try { TERM.resize(COLS, ROWS); } catch {}
}
addEventListener('resize', fit);

(async () => {
  document.getElementById('screen').addEventListener('animationend', e=>{
    if(e.animationName==='poweron') document.getElementById('screen').classList.remove('boot');
  });

  const { term } = await makeTerminal(fontForViewport());
  TERM = term;
  fit(); requestAnimationFrame(fit); setTimeout(fit,150); setTimeout(fit,500);

  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto+'://'+location.host+'/ws'); WS = ws;

  ws.onopen = () => { setStatus('online',true); fit();
    setTimeout(()=>{ bootEl.style.transition='opacity .4s'; bootEl.style.opacity='0'; setTimeout(()=>bootEl.style.display='none',420); }, 250);
    mount.focus?.(); };
  ws.onclose = () => { setStatus('OFFLINE',false); closed = true; restartEl.classList.add('show'); };
  ws.onerror = () => setStatus('error',false);
  ws.onmessage = (e) => {
    const data = typeof e.data==='string' ? e.data : new TextDecoder().decode(e.data);
    if (data) term.write(data);
  };

  term.onData((d)=>{ if (ws.readyState===WebSocket.OPEN) ws.send(d); });
  mount.tabIndex = 0;
  mount.addEventListener('click', ()=>mount.focus());

  // Reconnect after the link drops: any click/keypress reloads a fresh run.
  const reconnect = () => { if (closed) location.reload(); };
  restartEl.addEventListener('click', reconnect);
  addEventListener('keydown', reconnect, true);
})();
</script>
</body>
</html>
